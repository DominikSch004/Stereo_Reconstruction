%YAML:1.0
# Pipeline step backend configuration.
# Used by StereoReconstruction and IcpFusion (pass a different path as first CLI argument,
# default is ../config.yaml relative to the build directory).
#
# Steps without an alternative implementation are not configurable:
#   - sparse feature matching (always OpenCV SIFT + FLANN)
#   - essential matrix / pose recovery (always cv::findEssentialMat + cv::recoverPose;
#     see the comment in Pipeline.cpp step 3 for why E-from-F was abandoned)

# opencv | custom | custom_magsac | custom_prosac
fundamental_matrix: custom_magsac

# opencv | custom  (custom = Loop & Zhang projective rectification)
rectification: opencv

# opencv | custom  (WARNING: custom dense matching is not implemented yet)
disparity: opencv

# opencv | custom  (custom = per-pixel DLT triangulation)
triangulation: opencv

# point_to_point | point_to_plane  (only used by the IcpFusion executable)
icp_mode: point_to_plane

# ICP fusion pair selection (only used by the IcpFusion executable).
#   selected    -> the curated list of known-horizontal DTU pairs hardcoded in IcpFusion.cpp
#   consecutive -> OVERLAPPING sliding window (i, i+1), (i+1, i+2), ... over [icp_view_first, icp_view_last]
# In both modes vertical baselines are skipped automatically (dense stereo needs a horizontal pair).
# On DTU, verticals only occur at row boundaries (idx 5,19,28,38,49,54,59), so keep the
# range inside one row to keep the overlap chain connected. Views 6..19 are one clean row.
icp_pair_mode: consecutive
icp_view_first: 6
icp_view_last: 19

# Phase-1 robustness and fusion settings.
# Boolean values use 0/1 for OpenCV FileStorage portability.
stereo_confidence_filter: 1
stereo_lr_max_diff: 1.5
stereo_photometric_scale: 25.0
icp_robust: 1
icp_reciprocal: 1
icp_trim_fraction: 0.80

# Values are in the normalized coordinate system used by IcpFusion.
fusion_voxel_size: 0.01
fusion_outlier_factor: 1.5
