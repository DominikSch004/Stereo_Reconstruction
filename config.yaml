%YAML:1.0
# Pipeline step backend configuration.
# Used by StereoReconstruction and IcpFusion (pass a different path as first CLI argument,
# default is ../config.yaml relative to the build directory).
#
# Steps without an alternative implementation are not configurable:
#   - essential matrix / pose recovery (always cv::findEssentialMat + cv::recoverPose;
#     see the comment in Pipeline.cpp step 3 for why E-from-F was abandoned)

# select dataset and image pairs
dataset_id: 6
image_left_id: 35
image_right_id: 36
illumination_id: 3

# sift | orb
feature_detector: sift

# select ratio threshold for FLANN after SIFT.
ratio_threshold: 0.75

# 42 | -1 for true randomness
rng_seed: -1

# opencv | custom | custom_magsac | custom_prosac
fundamental_matrix: custom_magsac

# opencv | custom  (custom = Loop & Zhang projective rectification)
rectification: custom

# opencv | custom  (custom = simplified semi-global matching (Hirschmüller 2008),
# Birchfield-Tomasi cost + 16-direction path aggregation)
disparity: custom

# opencv | custom  (custom = per-pixel DLT triangulation)
triangulation: custom

# point_to_point | point_to_plane  (only used by the IcpFusion executable)
# point_to_point is the default: the per-point normals available here come from
# +/-1px central differences on raw stereo disparity and are too noisy to
# support point-to-plane residuals (they caused tangential drift in fusion).
icp_mode: point_to_plane

# true | false non-linear refinement of (R, t) directly on the essential-matrix
# space after recoverPose
pose_refinement: true

# true | false  Custom disparity backend only (Hirschmuller 2008 Sec 2.5.2): fits
# competing plane hypotheses per intensity segment to recover coverage/accuracy in
# untextured interiors. Helps on genuinely planar scenes like scan6 but hurts on
# curved objects like scan1, as it violate the paper's Assumption 3
# ("surface approximable by a plane"). Off by  default since scan1 is our primary scene.
intensity_consistent_disparity: false

# true | false  Custom disparity backend only (Hirschmuller 2008 Sec 2.5.3): pushes
# coverage to 100% by interpolating remaining gaps. Off by default as we have a low
# coverage.
disparity_gap_fill: false

# (0, 1.0]  image downscale factor applied before every pipeline step, via
# Pipeline::preprocessScale. 1.0 = full resolution, no downscale.
processing_scale: 1




